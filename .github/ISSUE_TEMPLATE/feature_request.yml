name: 功能建议
description: 新工具、新场景、MCP 消费体验改进
labels: ["type/feature", "flow/needs-triage"]
body:
  - type: textarea
    id: background
    attributes:
      label: 背景与场景
      description: 你遇到的问题或不便，比方案更重要——请描述真实使用场景
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
      description: 期望的能力形态（MCP 工具 / 工具参数 / Server 行为均可）
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 期望的交互示例
      placeholder: |
        > 把迭代里未完成的需求列出来，@负责人 确认后移到下迭代

        即依次调用 tapd_get_stories（按迭代过滤）→ 逐条 tapd_update_story 改负责人
  - type: dropdown
    id: area
    attributes:
      label: 期望落点
      description: 单包仓视角；内核新能力（TapdClient/registry）请在 xihe-lab/tapd-core 仓提
      options:
        - mcp 包体（新 MCP 工具 / agent 消费体验）
        - 仓库级（构建 / 发布 / 安装）
        - 上游 tapd-core 新内核能力（将引导你到对应仓提）
        - 文档 / 其他
  - type: input
    id: tapd
    attributes:
      label: 关联 TAPD 需求 ID（可选）
      description: 若已在 TAPD 立项请填长 ID 或短 ID，便于双向追踪
      placeholder: "1139814312001001546"
