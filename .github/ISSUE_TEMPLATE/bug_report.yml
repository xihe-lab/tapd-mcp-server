name: 缺陷报告
description: 报告 MCP Server 或其工具的行为问题
labels: ["type/bug", "flow/needs-triage"]
body:
  - type: textarea
    id: desc
    attributes:
      label: 问题描述
      description: 一句话概括错误行为
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 在 MCP 客户端（Claude Code、Cursor…）调用 tapd_xxx
        2. 传参 ...
        3. 观察 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 vs 实际行为
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响层面
      description: 单包仓视角；内核（TapdClient/registry/richtext）问题请到 xihe-lab/tapd-core 仓反馈
      options:
        - mcp 包体（工具行为 / Server 装配 / 传参）
        - 仓库级（构建 / 发布 / 安装 / 文档）
        - 疑似上游 tapd-core（将引导你到对应仓反馈）
        - 不确定
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: 相关工具名（如适用）
      placeholder: 如 tapd_create_comment、tapd_get_stories
  - type: dropdown
    id: version
    attributes:
      label: 版本
      options:
        - 2.0.0-rc.2 及以上（2.x 线）
        - 2.0.0-rc.1
        - 1.4.x（1.x 线）
        - 未发布（main/分支自建）
    validations:
      required: true
  - type: dropdown
    id: auth
    attributes:
      label: 认证方式
      options:
        - OAuth（TAPD_ACCESS_TOKEN，读写）
        - Basic（API User/Password，只读）
        - 无关
  - type: textarea
    id: env
    attributes:
      label: 环境信息
      placeholder: Node 版本 / OS / MCP 客户端（Claude Code、Cursor…）
  - type: textarea
    id: logs
    attributes:
      label: 报错输出 / 日志
      description: 脱敏后粘贴（token 替换为 ***）
      render: shell
