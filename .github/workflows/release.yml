name: Release - Publish to npm

on:
  push:
    branches:
      - 'releases/**'
  workflow_dispatch: # 支持手动触发（对齐当前手动发布惯例）
    inputs:
      dry_run:
        description: '演练模式（不发布不推 tag）'
        type: boolean
        default: false

# 同一时间只允许一个发布运行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm publish # 环境保护层：可挂 required reviewers 作发布前人审（无 secret，凭证走 OIDC）
    permissions:
      contents: write
      id-token: write # provenance 溯源签名

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing（OIDC）需要 npm ≥ 11.5 的原生 OIDC 支持
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Type check & Lint（全量门禁）
        run: |
          pnpm -r build
          pnpm -r type-check
          pnpm lint

      - name: Test (core + cli)
        run: pnpm --filter @xihe-lab/tapd-core --filter @xihe-lab/tapd-cli test

      - name: Get version from branch name
        id: version
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION="${BRANCH_NAME#releases/}"
          # workflow_dispatch 在任意分支触发时，取根 package.json 版本兜底
          if [ "$VERSION" = "$BRANCH_NAME" ]; then
            VERSION=$(node -p "require('./packages/mcp/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version matches packages/mcp
        run: |
          BRANCH_VERSION='${{ steps.version.outputs.version }}'
          PACKAGE_VERSION=$(node -p "require('./packages/mcp/package.json').version")
          if [ "$BRANCH_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Branch version ($BRANCH_VERSION) != packages/mcp version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Check if version already published
        id: check
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          if npm view @xihe-lab/tapd-mcp-server@$VERSION version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION already published, skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate changelog
        if: steps.check.outputs.published == 'false'
        id: changelog
        run: |
          CURRENT_TAG='${{ steps.version.outputs.tag }}'
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # npm Trusted Publishing：无任何 token，GitHub OIDC 直接向 npm 证明身份
      #（前提：npmjs.com 包设置里已登记本仓库 + release.yml 为 Trusted Publisher）
      - name: Publish to npm（monorepo：仅 mcp 包；core/cli 手动线另行发布）
        if: steps.check.outputs.published == 'false' && inputs.dry_run != true
        working-directory: packages/mcp
        run: npm publish --access public --provenance

      - name: Update GitHub Release
        if: steps.check.outputs.published == 'false' && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: false
          body: |
            ## Changelog

            ${{ steps.changelog.outputs.commits }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push tag
        if: steps.check.outputs.published == 'false' && inputs.dry_run != true
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Summary
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          if [ "${{ steps.check.outputs.published }}" == "false" ]; then
            if [ "${{ inputs.dry_run }}" == "true" ]; then
              echo "### 🧪 Dry-run 通过：可发布 @xihe-lab/tapd-mcp-server@$VERSION（未实际发布）" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### ✅ Published @xihe-lab/tapd-mcp-server@$VERSION" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Changelog:**" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.changelog.outputs.commits }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⏭️ Skipped - Version $VERSION already published" >> "$GITHUB_STEP_SUMMARY"
          fi
