# 子仓 CD 触发器：push releases/<版本> 即发起本包发布（子包自行触发，单包变更不必全量发）
# 发布执行仍在基座（工具链 / OIDC Trusted Publishing / workspace 链接都在基座）。
# 三重前置校验：分支版本一致 + 基座 main 指针已指到本提交 + 基座 main CI 在该提交上绿。
# 需仓库 secret BASE_DISPATCH_TOKEN（PAT：xihe-lab/tapd-node Contents 只读 + Actions 读写）。
name: CD · 发布触发

on:
  push:
    branches: ['releases/**']
  workflow_dispatch: # 手动补触发（校验同样新鲜）

permissions:
  contents: read

jobs:
  trigger:
    name: 校验并 dispatch 基座发布
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 校验分支版本
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          V="${BRANCH#releases/}"
          PV=$(node -p "require('./package.json').version")
          if [ "$V" != "$PV" ]; then
            echo "::error::分支版本 $V ≠ package.json $PV"
            exit 1
          fi
          echo "✓ 版本 $V"

      - name: 基座门禁校验（指针对齐 + CI 绿）
        env:
          GH_TOKEN: ${{ secrets.BASE_DISPATCH_TOKEN }}
        run: |
          BASE=xihe-lab/tapd-node
          MY_SHA=$(git rev-parse HEAD)
          HEAD_SHA=$(gh api "repos/$BASE/branches/main" --jq '.commit.sha')
          PTR=$(gh api "repos/$BASE/contents/mcp?ref=$HEAD_SHA" --jq '.sha')
          if [ "$PTR" != "$MY_SHA" ]; then
            echo "::error::基座 main 的 mcp 指针($PTR)未对齐本提交($MY_SHA)——先更新基座指针并等 CI 绿再推 release"
            exit 1
          fi
          CI=$(gh run list --repo "$BASE" --workflow ci.yml --branch main --limit 1 --json conclusion,headSha --jq '.[0] | .conclusion + "@" + .headSha')
          echo "基座 main CI: $CI（指针提交 $(git rev-parse --short $HEAD_SHA)）"
          case "$CI" in
            success@"$HEAD_SHA") ;;
            *) echo "::error::基座 main 最新 CI 不是当前指针提交上的 success"; exit 1 ;;
          esac

      - name: dispatch 基座发布（targets=mcp）
        env:
          GH_TOKEN: ${{ secrets.BASE_DISPATCH_TOKEN }}
        run: |
          gh workflow run cd-release.yml --repo xihe-lab/tapd-node --ref main -f targets=mcp
          echo "✓ 已触发基座 cd-release（targets=mcp），发布结果见基座 Actions"
