name: Release - Publish to npm

on:
  push:
    branches:
      - 'releases/**'
  workflow_dispatch: # 支持手动触发（对齐当前手动发布惯例）
    inputs:
      dry_run:
        description: '演练模式（不发布不推 tag）'
        type: boolean
        default: false
      sync_main:
        description: '发布成功后同步 main（fast-forward 合并）'
        type: boolean
        default: false
      targets:
        description: '发布目标包（monorepo 阶段三包同版本号；push releases/** 默认 all）'
        type: choice
        options: [all, mcp, core, cli]
        default: all

# 同一时间只允许一个发布运行
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm publish # 环境保护层：可挂 required reviewers 作发布前人审（无 secret，凭证走 OIDC）
    permissions:
      contents: write
      id-token: write # provenance 溯源签名

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing（OIDC）需要 npm ≥ 11.5 的原生 OIDC 支持
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Type check & Lint（全量门禁）
        run: |
          pnpm -r build
          pnpm -r type-check
          pnpm lint

      - name: Test (core + cli)
        run: pnpm --filter @xihe-lab/tapd-core --filter @xihe-lab/tapd-cli test

      - name: Get version from branch name
        id: version
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          VERSION="${BRANCH_NAME#releases/}"
          # workflow_dispatch 在任意分支触发时，取根 package.json 版本兜底
          if [ "$VERSION" = "$BRANCH_NAME" ]; then
            VERSION=$(node -p "require('./packages/mcp/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # 目标包解析：push 事件无 inputs → all；dispatch 按选择
      - name: Resolve targets
        id: targets
        run: |
          T='${{ inputs.targets }}'
          [ -z "$T" ] && T='all'
          echo "targets=$T" >> "$GITHUB_OUTPUT"
          case "$T" in
            all) DIRS="packages/mcp packages/core packages/cli" ;;
            mcp) DIRS="packages/mcp" ;;
            core) DIRS="packages/core" ;;
            cli) DIRS="packages/cli" ;;
          esac
          echo "dirs=$DIRS" >> "$GITHUB_OUTPUT"

      - name: Verify version matches target packages
        run: |
          BRANCH_VERSION='${{ steps.version.outputs.version }}'
          for d in ${{ steps.targets.outputs.dirs }}; do
            PV=$(node -p "require('./$d/package.json').version")
            if [ "$BRANCH_VERSION" != "$PV" ]; then
              echo "::error::Branch version ($BRANCH_VERSION) != $d version ($PV)"
              exit 1
            fi
          done
          echo "✓ 目标包版本一致: ${{ steps.targets.outputs.targets }}"

      - name: Check unpublished packages
        id: check
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          TODO=""
          for d in ${{ steps.targets.outputs.dirs }}; do
            NAME=$(node -p "require('./$d/package.json').name")
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$NAME@$VERSION 已发布，跳过"
            else
              TODO="$TODO $d"
            fi
          done
          {
            echo "todo_dirs=${TODO# }"
            echo "published=$([ -z "$TODO" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        if: steps.check.outputs.published == 'false'
        id: changelog
        run: |
          CURRENT_TAG='${{ steps.version.outputs.tag }}'
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          {
            echo "commits<<EOF"
            echo "$COMMITS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # npm Trusted Publishing：无任何 token，GitHub OIDC 直接向 npm 证明身份
      #（前提：每个包在 npmjs.com 分别登记本仓库 + cd-release.yml 为 Trusted Publisher）
      - name: Publish target packages
        if: steps.check.outputs.published == 'false' && inputs.dry_run != true
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          # prerelease 版本（含 -rc.x 等）必须打 rc 标签，严禁抢占 latest（latest = 稳定线）
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG="--tag rc"
            echo "/dist-tag: $DIST_TAG（prerelease）"
          else
            DIST_TAG=""
            echo "/dist-tag: latest（正式版）"
          fi
          for d in ${{ steps.check.outputs.todo_dirs }}; do
            echo "── 发布 $d ──"
            (cd "$d" && npm publish --access public --provenance $DIST_TAG) || exit 1
          done

      # 顺序约定：① npm 发布成功 → ② 打附注 tag → ③ GitHub Release 挂到该 tag → ④（可选）同步 main
      # tag 是发布成功的产物（发布失败不打 tag）；Release 挂在既有 tag 上，避免双重创建
      - name: Create and push tag
        if: steps.check.outputs.published == 'false' && inputs.dry_run != true
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::notice::tag v$VERSION 已存在，跳过"
          else
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
          fi

      - name: Update GitHub Release
        if: steps.check.outputs.published == 'false' && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: false
          body: |
            ## Changelog

            ${{ steps.changelog.outputs.commits }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 合 main 时机：默认不自动（rc 阶段 main 跟稳定线）；GA 或显式勾选时 fast-forward
      - name: Sync main（可选）
        if: inputs.sync_main == true && steps.check.outputs.published == 'false' && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          if git merge --ff-only "${{ github.sha }}"; then
            git push origin main
            echo "### 🔀 main 已同步至 v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::main 无法 fast-forward（存在分叉），需人工合并"
            exit 1
          fi

      - name: Summary
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          if [ "${{ steps.check.outputs.published }}" == "false" ]; then
            if [ "${{ inputs.dry_run }}" == "true" ]; then
              echo "### 🧪 Dry-run 通过：可发布 @xihe-lab/tapd-mcp-server@$VERSION（未实际发布）" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### ✅ Published @xihe-lab/tapd-mcp-server@$VERSION" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Changelog:**" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.changelog.outputs.commits }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⏭️ Skipped - Version $VERSION already published" >> "$GITHUB_STEP_SUMMARY"
          fi
