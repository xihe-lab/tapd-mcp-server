# actions/labeler 路径映射（PR 打开时自动打 pkg/* 标签，对齐 LABELS.md 五轴）
# mcp 单包仓：core/cli 已独立成仓，本仓改动即 mcp 包或仓库级
pkg/mcp:
  - changed-files:
      - any-glob-to-any-file: src/**

pkg/repo:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .npmrc
          - package.json
          - pnpm-lock.yaml
          - tsconfig*.json
          - .env.example
          - LICENSE
          - README.md
          - CHANGELOG.md

type/docs:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'
